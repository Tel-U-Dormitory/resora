name: Publish Docker images to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both builds use synthetic templates via BuildKit secret mounts.
      # No production env, database, migration, or deployment is needed.
      - name: Build and publish server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tel-u-dormitory/resora-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Tel-U-Dormitory/resora
            org.opencontainers.image.revision=${{ github.sha }}
          secret-files: |
            web_env=apps/web/.env.example
            server_env=apps/server/.env.example
      - name: Build and publish web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tel-u-dormitory/resora-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Tel-U-Dormitory/resora
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=/
            API_UPSTREAM_URL=http://server:3000
            SERVER_URL=http://server:3000
          secret-files: |
            web_env=apps/web/.env.example
            server_env=apps/server/.env.example

name: CD — Publish Images

on:
  push:
    branches: [staging, main]

permissions:
  contents: read

# Serialize each branch through deployment; retain up to 100 pending runs.
concurrency:
  group: ghcr-publish-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      server_digest: ${{ steps.server.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both builds use synthetic templates via BuildKit secret mounts.
      # No production env, database, migration, or deployment is needed.
      - name: Build and publish server
        id: server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          cache-from: type=gha,scope=resora-server
          cache-to: type=gha,mode=max,scope=resora-server
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tel-u-dormitory/resora-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Tel-U-Dormitory/resora
            org.opencontainers.image.revision=${{ github.sha }}
          secret-files: |
            web_env=apps/web/.env.example
            server_env=apps/server/.env.example
      - name: Build and publish web
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          cache-from: type=gha,scope=resora-web
          cache-to: type=gha,mode=max,scope=resora-web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/tel-u-dormitory/resora-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Tel-U-Dormitory/resora
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=/
            API_UPSTREAM_URL=http://server:3000
            SERVER_URL=http://server:3000
          secret-files: |
            web_env=apps/web/.env.example
            server_env=apps/server/.env.example

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Environment-scoped vars are available after entering the environment.
      # Do not put CD_ENABLED at job level: environment vars are unavailable there.
      - name: Deployment disabled
        if: vars.CD_ENABLED != 'true'
        run: echo 'Production deployment disabled; no SSH connection will be made.'
      - uses: actions/checkout@v6
        if: vars.CD_ENABLED == 'true'
        with:
          persist-credentials: false
      - name: Deploy exact published pair
        if: vars.CD_ENABLED == 'true'
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SERVER_DIGEST: ${{ needs.publish.outputs.server_digest }}
          WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
        run: bash scripts/deploy-prod-ssh.sh

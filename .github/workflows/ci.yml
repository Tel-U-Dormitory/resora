name: CI — Code Quality

on:
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  quality:
    name: CI — Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      VARLOCK_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      # Nonfunctional synthetic values for Varlock validation/codegen/build only.
      # No service is started and no live database integration test is selected.
      DATABASE_URL: postgresql://127.0.0.1:1/resora_ci_unavailable
      DIRECT_DB_URL: postgresql://127.0.0.1:1/resora_ci_unavailable
      BETTER_AUTH_SECRET: ci-only-synthetic-auth-secret-000000000000
      BETTER_AUTH_URL: http://127.0.0.1:3000
      CORS_ORIGIN: http://127.0.0.1:3001
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # pnpm version is read from package.json's pinned packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      # Existing postinstall performs Varlock codegen for all three schemas.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:pr
